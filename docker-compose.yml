volumes:
  etc_wireguard:

services:
  wg-easy:
    environment:
      # Change Language:
      # (Supports: en, ua, ru, tr, no, pl, fr, de, ca, es, ko, vi, nl, is, pt, zh_CN, zh_TW, it, th, hi)
      - LANG=zh_CN
      # ⚠️ Required:
      # Change this to your host's public address
      - WG_HOST=raspberrypi.local
      # ⚠️ Required: Web UI will not start without PASSWORD_HASH.
      # Generate your own (see "How_to_generate_an_bcrypt_hash.md") and double every $ here.
      - PASSWORD_HASH=
      # Optional: use a stable key for signing session cookies
      # - SESSION_SECRET=change-me-to-a-long-random-string
      - SECURE_COOKIE=true
      - WEBUI_VPN_ACCESS=false
      # Behind a reverse proxy / Cloudflare Tunnel publishing 127.0.0.1:51821:
      # - TRUSTED_PROXIES=172.18.0.1 # replace with the actual address of your trusted proxy
      # - REAL_IP_HEADER=cf-connecting-ip # or x-forwarded-for for other proxies
      # - WG_EGRESS_FILTER=true # IPv4 egress policy; see the README for private networks and DNS

      # Optional:
      # - PORT=51821
      # - WG_PORT=51820
      # - WG_CONFIG_PORT=92820
      # - WG_DEFAULT_ADDRESS=10.8.0.x
      # - WG_DEFAULT_DNS=1.1.1.1
      # - WG_MTU=1420
      # - WG_ALLOWED_IPS=192.168.15.0/24, 10.0.1.0/24
      # - WG_PERSISTENT_KEEPALIVE=25
      # - WG_PRE_UP=echo "Pre Up" > /etc/wireguard/pre-up.txt
      # - WG_POST_UP=echo "Post Up" > /etc/wireguard/post-up.txt
      # - WG_PRE_DOWN=echo "Pre Down" > /etc/wireguard/pre-down.txt
      # - WG_POST_DOWN=echo "Post Down" > /etc/wireguard/post-down.txt
      # - UI_TRAFFIC_STATS=true
      # - UI_CHART_TYPE=0 # (0 Charts disabled, 1 # Line chart, 2 # Area chart, 3 # Bar chart)

    image: ghcr.io/xwvike/wg-easy
    container_name: wg-easy
    volumes:
      - etc_wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      # - SYS_MODULE # only if the host has not loaded the wireguard module
      # - NET_RAW # ⚠️ Uncomment if using Podman 
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=0
      # - net.netfilter.nf_conntrack_acct=1 # Optional: device-to-device rates in the traffic topology
